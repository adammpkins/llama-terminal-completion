# Default endpoint configuration
base_url: http://localhost:11434/v1
model: llama3.2
api_key: ""

# Behavior settings
max_tokens: 1024
temperature: 0.7
stream: true
confirm_commands: true
shell: /bin/zsh

# Default role (system-prompt preset) applied when no --role is given
default_role: ""

# Structured output (--schema): auto | native | prompt
structured_output_mode: auto

# Embedding model used by `lt rag`
embedding_model: nomic-embed-text

# Examples for different providers:
#
# For Ollama (default):
#   base_url: http://localhost:11434/v1
#   model: llama3.2
#
# For LM Studio:
#   base_url: http://localhost:1234/v1
#   model: local-model
#
# For OpenAI:
#   base_url: https://api.openai.com/v1
#   model: gpt-4o-mini
#   api_key: sk-...
#
# For llama.cpp server:
#   base_url: http://localhost:8080/v1
#   model: default
